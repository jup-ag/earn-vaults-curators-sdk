[package]
name = "offerbook-client"
version = "0.1.0"
edition.workspace = true
description = "Autogenerated wincode-based client for the `offerbook` Solana program"
publish = false

[dependencies]
solana-address = { workspace = true, features = ["wincode"] }
solana-instruction.workspace = true
wincode = { workspace = true, features = ["derive", "alloc"] }

[lib]
test = false
doctest = false
