[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
askama = "0.16.0"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
codama = "0.13.2"
codama-macros = "0.13.2"
const-crypto = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-account-view = "2.0.0"
solana-hash = "4.6"
solana-sha256-hasher = "3.1.0"
solana-instruction = "3.5.0"
solana-instruction-view = "2.1.0"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-program-error = "3.0.1"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"
thiserror = "2.0"
ureq = { version = "3.4.2", features = ["json"] }
wincode = { version = "0.6.3", default-features = false }
zeropod = { version = "0.4.0", default-features = false, features = ["solana-address"] }
earn-vaults-interface = { path = "crates/interface" }
earn-vaults-sdk = { path = "crates/sdk" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(target_os, values(\"solana\"))",
    "cfg(kani)",
] }
